[package]
name = "ycallr-core"
version = "0.1.0"
edition = "2021"
description = "High-performance API execution engine - YAML-to-Protobuf AOT compilation"
license = "MIT OR Apache-2.0"
authors = ["Leodoras"]

[lib]
name = "ycallr_core"
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"
prost = "0.12"
thiserror = "1.0"
regex = "1.10"
base64 = "0.22"
percent-encoding = "2.3"

[build-dependencies]
prost-build = "0.12"

[dev-dependencies]
wasm-bindgen-test = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
dirs = "5"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tempfile = "3.10"
assert_cmd = "2.0"
predicates = "3.0"
mockito = "1.6"

[features]
default = ["yaml", "protobuf"]
yaml = []
protobuf = []
call-engine = []
client = ["call-engine", "dep:reqwest"]
test-utils = ["client"]
ffi = ["client", "yaml", "protobuf"]
wasm = [
    "yaml",
    "protobuf",
    "call-engine",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:js-sys",
    "dep:web-sys",
]

[dependencies.reqwest]
version = "0.12"
features = ["blocking", "json", "multipart"]
optional = true

[dependencies.wasm-bindgen]
version = "0.2"
optional = true

[dependencies.wasm-bindgen-futures]
version = "0.4"
optional = true

[dependencies.js-sys]
version = "0.3"
optional = true

[dependencies.web-sys]
version = "0.3"
optional = true
features = [
    "FormData",
    "Headers",
    "Request",
    "RequestInit",
    "RequestMode",
    "Response",
    "Window",
]

[package.metadata.tarpaulin]
exclude-files = ["src/wasm.rs"]

[profile.release]
lto = true
opt-level = "s"
strip = true
