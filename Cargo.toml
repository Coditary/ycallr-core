[package]
name = "ycallr-core"
version = "0.1.0"
edition = "2021"
description = "High-performance API execution engine - YAML-to-Protobuf AOT compilation"
license = "MIT OR Apache-2.0"
authors = ["Leodoras"]

[lib]
name = "ycallr_core"
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
prost = "0.12"
thiserror = "1.0"

[build-dependencies]
prost-build = "0.12"

[dev-dependencies]
tempfile = "3.10"
assert_cmd = "2.0"
predicates = "3.0"
mockito = "1.6"

[features]
default = ["yaml", "protobuf"]
yaml = []
protobuf = []
client = ["dep:reqwest", "dep:serde_json"]
test-utils = ["client"]
ffi = []
wasm = ["dep:wasm-bindgen", "dep:serde_json"]
uniffi = ["dep:uniffi"]

[dependencies.reqwest]
version = "0.12"
features = ["blocking", "json"]
optional = true

[dependencies.serde_json]
version = "1.0"
optional = true

[dependencies.wasm-bindgen]
version = "0.2"
optional = true

[dependencies.uniffi]
version = "0.28"
optional = true

[profile.release]
lto = true
opt-level = "s"
strip = true
