[package]
name = "ycallr-core"
version = "0.1.0"
edition = "2021"
description = "High-performance API execution engine - YAML-to-Protobuf AOT compilation"
license = "MIT OR Apache-2.0"
authors = ["Leodoras"]

[lib]
name = "ycallr_core"
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"
prost = "0.12"
thiserror = "1.0"
regex = "1.10"
multer = "3"
base64 = "0.22"

[build-dependencies]
prost-build = "0.12"

[dev-dependencies]
wasm-bindgen-test = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tempfile = "3.10"
assert_cmd = "2.0"
predicates = "3.0"
mockito = "1.6"

[features]
default = ["yaml", "protobuf"]
yaml = []
protobuf = []
client = ["dep:reqwest"]
test-utils = ["client"]
ffi = ["client", "yaml"]
wasm = ["dep:wasm-bindgen"]
uniffi = ["dep:uniffi"]

[dependencies.reqwest]
version = "0.12"
features = ["blocking", "json", "multipart"]
optional = true

[dependencies.wasm-bindgen]
version = "0.2"
optional = true

[dependencies.uniffi]
version = "0.28"
optional = true

[profile.release]
lto = true
opt-level = "s"
strip = true
