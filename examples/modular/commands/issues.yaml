create-issue:
  endpoint: /repos/{owner}/{repo}/issues
  method: POST
  auth: github
  headers:
    Accept: application/vnd.github.v3+json
    Content-Type: application/json
  params:
    owner:
      description: Repository owner
      type: string
      required: true
    repo:
      description: Repository name
      type: string
      required: true
    title:
      description: Issue title
      type: string
      required: true
    body:
      description: Issue body
      type: string
      required: false
  responses:
    "201":
      message: "Created issue #{output.number}: {output.title}"

list-issues:
  endpoint: /repos/{owner}/{repo}/issues
  method: GET
  auth: github
  headers:
    Accept: application/vnd.github.v3+json
  params:
    owner:
      description: Repository owner
      type: string
      required: true
    repo:
      description: Repository name
      type: string
      required: true
    state:
      description: Filter by state (open, closed, all)
      type: string
      required: false
      enum:
        - open
        - closed
        - all
  responses:
    success:
      message: "Listed issues for {input.owner}/{input.repo}"
