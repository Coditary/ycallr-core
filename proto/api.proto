syntax = "proto3";

package ycallr;

option java_package = "io.ycallr.core";
option java_multiple_files = true;

message ApiDefinition {
  string name = 1;
  string version = 2;
  string description = 3;
  string base_url = 4;
  map<string, Command> commands = 5;
  repeated EnvVar env = 6;
  map<string, AuthConfig> auth = 7;
}

message Command {
  optional string description = 6;
  optional string endpoint = 1;
  optional HttpMethod method = 2;
  map<string, string> headers = 3;
  map<string, Parameter> params = 4;
  map<string, Command> commands = 5;
  optional ResponseConfig responses = 7;
  optional BodyConfig body = 8;
  optional string auth = 9;
}

message AuthConfig {
  oneof kind {
    BearerAuth bearer = 1;
    ApiKeyAuth api_key = 2;
    HttpAuth http = 3;
  }
}

message BearerAuth {
  string token = 1;
}

message ApiKeyAuth {
  string key = 1;
  string name = 2;
  ApiKeyLocation location = 3;
}

enum ApiKeyLocation {
  HEADER = 0;
  QUERY = 1;
  COOKIE = 2;
}

message HttpAuth {
  string scheme = 1;
  optional string token = 2;
  optional string username = 3;
  optional string password = 4;
  optional string prefix = 5;
}

message ResponseConfig {
  optional ResponseEntry success = 1;
  optional ResponseEntry failure = 2;
  optional ResponseEntry warn = 3;
  map<string, ResponseEntry> codes = 4;
}

message ResponseEntry {
  string message = 1;
}

message BodyConfig {
  optional string json = 1;
  map<string, string> fields = 2;
  optional string raw = 3;
  repeated MultipartField multipart = 4;
}

message MultipartField {
  string name = 1;
  optional string text = 2;
  optional string file = 3;
}

message EnvVar {
  string name = 1;
  bool required = 2;
}

enum HttpMethod {
  GET = 0;
  POST = 1;
  PUT = 2;
  DELETE = 3;
  PATCH = 4;
}

message Parameter {
  string description = 1;
  ParamType type = 2;
  bool required = 3;
}

enum ParamType {
  STRING = 0;
  NUMBER = 1;
  BOOLEAN = 2;
  ARRAY = 3;
}
